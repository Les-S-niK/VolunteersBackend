[project]
name = "VolunteersBackend"
version = "0.1.0"
description = "VolunteersBackend is a backend part of an application that will be helping volunteers with their tasks."
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "asyncpg>=0.31.0",
    "ddgs>=9.13.0",
    "faker>=40.4.0",
    "fastapi>=0.128.6",
    "fastapi-guard>=4.2.2",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.13.0",
    "pyjwt>=2.11.0",
    "pytest-asyncio>=1.3.0",
    "python-multipart>=0.0.22",
    "redis>=7.1.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
