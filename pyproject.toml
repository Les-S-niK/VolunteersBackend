[project]
name = "VolunteersBackend"
version = "0.1.0"
description = "VolunteersBackend is a backend part of an application that will be helping volunteers with their tasks."
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "fastapi>=0.128.6",
    "fastapi-guard>=4.2.2",
    "phonenumbers>=9.0.23",
    "pydantic-extra-types>=2.11.0",
    "pydantic-settings>=2.13.0",
    "pyjwt>=2.11.0",
    "python-multipart>=0.0.22",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
]
